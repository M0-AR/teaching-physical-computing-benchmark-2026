<text x="110" y="27" font-family="monospace" font-size="14" fill="#e5e7eb">pcb-benchmark — 60-second demo (loops)</text>
<text x="30" y="90" font-family="monospace" font-size="15" fill="#7dd3fc" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.0091;0.1818;0.2000" dur="11.0s" repeatCount="indefinite"/>$ python experiments/01_curriculum_audit.py</text><text x="30" y="112" font-family="monospace" font-size="14" fill="#86efac" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0455;0.0727;0.1818;0.2000" dur="11.0s" repeatCount="indefinite"/>[01] OK: 4 courses, 42 weeks, 42 modules</text><text x="30" y="152" font-family="monospace" font-size="15" fill="#7dd3fc" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2091;0.3818;0.4000" dur="11.0s" repeatCount="indefinite"/>$ python experiments/02_hardware_benchmark.py</text><text x="30" y="174" font-family="monospace" font-size="14" fill="#86efac" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2455;0.2727;0.3818;0.4000" dur="11.0s" repeatCount="indefinite"/>[02] OK: micro:bit &gt; Pico W &gt; Uno &gt; Pi4B</text><text x="30" y="214" font-family="monospace" font-size="15" fill="#7dd3fc" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.4091;0.5818;0.6000" dur="11.0s" repeatCount="indefinite"/>$ python experiments/03_literature_triangulation.py</text><text x="30" y="236" font-family="monospace" font-size="14" fill="#86efac" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4455;0.4727;0.5818;0.6000" dur="11.0s" repeatCount="indefinite"/>[03] OK: 97 / 641653 / 80284 works</text><text x="30" y="276" font-family="monospace" font-size="15" fill="#7dd3fc" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.6091;0.7818;0.8000" dur="11.0s" repeatCount="indefinite"/>$ python experiments/05_hidden_patterns.py</text><text x="30" y="298" font-family="monospace" font-size="14" fill="#86efac" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6455;0.6727;0.7818;0.8000" dur="11.0s" repeatCount="indefinite"/>[05] OK: 6 patterns, mean conf 0.857</text><text x="30" y="338" font-family="monospace" font-size="15" fill="#7dd3fc" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.8091;0.9818;1.0000" dur="11.0s" repeatCount="indefinite"/>$ pytest -q</text><text x="30" y="360" font-family="monospace" font-size="14" fill="#86efac" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8455;0.8727;0.9818;1.0000" dur="11.0s" repeatCount="indefinite"/>4 passed in 0.15s — ALL GREEN</text>
<text x="30" y="398" font-family="monospace" font-size="12" fill="#6b7280">Tip: every line above is a real command. Copy-paste it — it works.</text>
